name: Build LibraryTool Windows .exe

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" "pytest>=8.0"

      - name: Run tests
        run: python -m pytest -q

      - name: Build LibraryTool.exe
        run: pyinstaller --noconfirm librarytool.spec

      - name: Download Android platform-tools (adb)
        shell: pwsh
        run: |
          $url = "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile platform-tools.zip
          Expand-Archive -Path platform-tools.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/LibraryTool.exe package/
          New-Item -ItemType Directory -Force -Path package/adb | Out-Null
          Copy-Item platform-tools/adb.exe package/adb/
          Copy-Item platform-tools/AdbWinApi.dll package/adb/
          Copy-Item platform-tools/AdbWinUsbApi.dll package/adb/
          New-Item -ItemType Directory -Force -Path package/adb/.android | Out-Null
          Copy-Item adb_bundle/.android/adbkey package/adb/.android/
          Copy-Item adb_bundle/.android/adbkey.pub package/adb/.android/
          Copy-Item authorize_tablet.bat package/
          Copy-Item CUSTOMER_GUIDE_WINDOWS.txt package/
          Copy-Item README.md package/
          Write-Host "Package contents:"
          Get-ChildItem -Recurse package/

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "package/LibraryTool.exe")) { throw "Missing LibraryTool.exe" }
          if (-not (Test-Path "package/adb/adb.exe")) { throw "Missing adb.exe" }
          $size = (Get-Item "package/LibraryTool.exe").Length
          Write-Host "LibraryTool.exe size: $size bytes"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LibraryTool-windows
          path: desktop/package/
          retention-days: 90
          if-no-files-found: error
