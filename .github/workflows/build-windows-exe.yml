name: Build LibraryTool Windows .exe

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" "pytest>=8.0"

      - name: Run tests
        run: python -m pytest -q

      - name: Build LibraryTool.exe
        run: pyinstaller --noconfirm librarytool.spec

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "Contents of dist/:"
          Get-ChildItem -Recurse dist/
          if (-not (Test-Path "dist/LibraryTool.exe")) {
            Write-Error "dist/LibraryTool.exe was not created"
            exit 1
          }
          $size = (Get-Item "dist/LibraryTool.exe").Length
          Write-Host "LibraryTool.exe size: $size bytes"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LibraryTool-windows
          path: desktop/dist/LibraryTool.exe
          retention-days: 90
          if-no-files-found: error
