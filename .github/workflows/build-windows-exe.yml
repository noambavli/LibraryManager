name: Build LibraryTool Windows .exe

# Builds the desktop companion (.exe) on a Windows runner and uploads it as an
# artifact, so you can get LibraryTool.exe without owning a Windows PC.
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" "pytest>=8.0"

      - name: Run tests
        run: python -m pytest -q

      - name: Build LibraryTool.exe
        run: pyinstaller --noconfirm librarytool.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LibraryTool-windows
          path: desktop/dist/LibraryTool.exe
          if-no-files-found: error
